# Infrastructure for local dev — start these before running the API or Web locally.
# Usage:
#   docker compose up -d                  # postgres + redis only (default)
#   docker compose --profile app up -d    # also build & run api + web

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openpsa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=openpsa;Username=postgres;Password=postgres"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8080:8080"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    depends_on:
      - api
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  redis_data:
