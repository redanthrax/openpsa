# Default values for openpsa.
# Override with `helm install ... -f my-values.yaml`.

image:
  registry: ghcr.io
  repository: redanthrax/openpsa
  pullPolicy: IfNotPresent
  # Tag defaults to .Chart.AppVersion if unset.
  tag: ""

api:
  enabled: true
  replicas: 2
  image:
    name: api          # final image: {registry}/{repository}-api:{tag}
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  env: {}              # extra env vars (key: value)
  envFrom: []          # list of {secretRef:{name:...}} or {configMapRef:{name:...}}
  probes:
    liveness:
      path: /health
    readiness:
      path: /health
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

web:
  enabled: true
  replicas: 2
  image:
    name: web
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: openpsa.local
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
  tls: []

# Set externally; do NOT commit real secrets.
# Either reference an existing secret (preferred) or have the chart create one.
secrets:
  existingSecret: ""   # if set, expected to expose ConnectionStrings__DefaultConnection, Redis__ConnectionString, Jwt__Key
  create: false
  data:
    connectionString: ""
    redisConnectionString: ""
    jwtKey: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
